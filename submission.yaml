submission:
  title: "QUAY — Container Congestion Predictor & Port Operations Optimiser"

  problem_statement: >
    The 2021 LA/Long Beach port backlog stranded 100+ container vessels offshore, costing global supply chains over $10B. Port operators still allocate berths, cranes, and yard space across hundreds of vessels manually in spreadsheets, discovering congestion hotspots reactively after queues form when alternate routing decisions are too late.

  solution_summary: >
    QUAY is an intelligent port operations decision-support system that predicts congestion hotspots up to 72 hours in advance, recommends alternate routing strategies, optimises joint berth and crane assignments using Google OR-Tools CP-SAT, and generates executable 72-hour shift plans with an auditable BOB Operations Copilot.

  key_features:
    - "Predictive Congestion Forecasting: Hourly hotspot predictions over 72 hours using scikit-learn models and FIFO physical resource projections."
    - "Joint Berth & Crane Optimisation: Google OR-Tools CP-SAT solver enforcing draft, length, crane capacity, tide clearance, and yard limits on a 15-minute grid."
    - "Alternate Routing & What-If Engine: Conditional evaluations comparing arrival speed adjustments, terminal transfers, and alternate ports with cost/carbon trade-offs."
    - "72-Hour Rolling Supervisor Shift Plans: Automated generation of 9 consecutive 8-hour shift plans with handovers, work orders, and exportable JSON/CSV/HTML."
    - "BOB Operations Copilot & Live Replanning: Evidence-grounded operational reasoning with optional IBM watsonx.ai/Granite adapter and real-time SSE replanning."

  tech_stack:
    languages: ["Python", "TypeScript"]
    frameworks: ["FastAPI", "React", "Vite"]
    ibm_technologies: ["watsonx.ai", "Granite", "IBM Bob"]
    databases: ["SQLite", "PostgreSQL", "SQLAlchemy"]
    other: ["Google OR-Tools", "scikit-learn", "Docker", "Leaflet", "Recharts", "Pydantic"]

  what_we_are_most_proud_of: >
    The auditable end-to-end integration: instead of an opaque AI black box, QUAY pairs mathematical constraint guarantees (OR-Tools CP-SAT with independent validation) with machine learning forecasts and an evidence-grounded BOB Operations Copilot, keeping human supervisors firmly in command with 1-click approvals and transparent handover logs.

  known_limitations: >
    The current evaluation relies on reproducible synthetic port datasets and simulation proxies for emissions and costs. Live AIS ingestion, production TOS (Terminal Operating System) bidirectional sync, and port-specific commercial agreements remain future work. Live IBM watsonx.ai connectivity requires user-supplied credentials.

